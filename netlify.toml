# Static site: no build step. Netlify serves files from the repo root.
[build]
  publish = "."

# Browsers auto-request /favicon.ico from the root; serve the SVG there so the
# legacy probe resolves (200) instead of 404ing.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS keep their filenames across deploys, so they must revalidate on
# every visit (ETag makes this a cheap 304 when unchanged). A week-long
# max-age here once left returning visitors with new HTML + stale CSS.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
